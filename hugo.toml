baseURL = 'https://stevemurr.com/'
languageCode = 'en-us'
title = 'Steve Murr'
theme = 'ResumeFrame'

[taxonomies]
  tag = 'tags'
  series = 'series'

[pagination]
  pagerSize = 5

[params]
  showReadingTime = true

  # The chat surfaces ("Ask AI anything" on the landing page, "Chat about this
  # research" on posts) proxy to a self-hosted LiteLLM box that is no longer
  # exposed. Flip to true to bring them back; /api/chat honors the same flag.
  enableLLMChat = false

  [params.profileMode]
    # Read by the theme head partial as the default meta description.
    subtitle = "Software engineer in San Jose building AI-native products, local-first search systems, and developer tooling."

[menu]
  [[menu.main]]
    identifier = "code"
    name = "Code"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "research"
    name = "Research"
    url = "/research/"
    weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
